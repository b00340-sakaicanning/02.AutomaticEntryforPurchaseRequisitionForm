<style>
  /* =========================================================================
     物品購入届CSV出力アプリ - CSS (css.html)
     版: v1.0 2026/10/31
     デザインは「02.ロッカーキー貸出管理(Gemini)」の css.html の変数と共通部品に合わせる（plan/05 §0）
     ========================================================================= */

  /* 1. CSS 変数（参考アプリと同じ値。--violet はこのアプリだけ） */
  :root {
    --primary: #0284c7;
    --primary-hover: #0369a1;
    --primary-light: #e0f2fe;
    --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);

    --secondary: #475569;
    --secondary-hover: #334155;
    --secondary-light: #f1f5f9;

    --success: #10b981;
    --success-hover: #059669;
    --success-light: #d1fae5;

    --warning: #f59e0b;
    --warning-light: #fef3c7;

    --danger: #ef4444;
    --danger-hover: #dc2626;
    --danger-light: #fee2e2;

    --violet: #6d28d9;
    --violet-light: #ede9fe;

    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --border: #e2e8f0;
    --border-focus: #38bdf8;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;

    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-full: 9999px;
  }

  /* 2. リセットと文字 */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; box-sizing: border-box; }
  input, select, textarea { font-family: inherit; }
  .muted { color: var(--text-muted); }
  .small { font-size: 0.8rem; }
  .mono { font-family: monospace; }
  .nowrap { white-space: nowrap; }

  /* 3. レイアウトとヘッダー */
  .app-container { max-width: 1320px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .app-header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-card); padding: 1rem 1.5rem; border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 1rem;
    flex-wrap: wrap; gap: 1rem;
  }
  .header-logo { display: flex; align-items: center; gap: 0.75rem; }
  .logo-icon {
    width: 2.2rem; height: 2.2rem; color: var(--primary); background: var(--primary-light);
    padding: 0.4rem; border-radius: var(--radius-md); flex-shrink: 0;
  }
  .header-logo h1 { font-family: 'Outfit', 'Noto Sans JP', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
  .header-actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }

  .operator-box { display: flex; align-items: center; gap: 0.5rem; }
  .operator-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .operator-select {
    height: 42px; min-height: 42px; max-height: 42px; min-width: 240px; padding: 0 0.85rem;
    border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 600;
    color: var(--text-main); background: var(--bg-card); outline: none; cursor: pointer;
  }
  .operator-select:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
  .auth-status {
    display: inline-flex; align-items: center; gap: 0.4rem; height: 42px; padding: 0 0.5rem 0 0.75rem;
    background: var(--success-light); color: var(--success-hover); border-radius: var(--radius-md);
    font-size: 0.8rem; font-weight: 700; white-space: nowrap;
  }
  .auth-icon { width: 1.1rem; height: 1.1rem; }

  /* 4. タブ（セグメント型） */
  .app-tabs {
    display: flex; align-items: center; gap: 0.5rem; background: var(--bg-card);
    padding: 0.35rem; border-radius: var(--radius-md); border: 1px solid var(--border);
  }
  .main-tabs { margin-bottom: 1.5rem; overflow-x: auto; box-shadow: var(--shadow-sm); }
  .tab-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0 1.1rem;
    border: none; background: transparent; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600;
    color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;
    height: 42px; min-height: 42px; max-height: 42px; line-height: 1; align-self: center; flex-shrink: 0; white-space: nowrap;
  }
  .tab-btn .tab-icon { width: 1.15rem; height: 1.15rem; flex-shrink: 0; }
  .tab-btn.active { background: var(--primary-light); color: var(--primary); box-shadow: var(--shadow-sm); }

  .tab-view { display: none; }
  .tab-view.active { display: block; animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .view-header { margin-bottom: 1.25rem; }
  .view-header h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem; }
  .view-header p { font-size: 0.875rem; color: var(--text-muted); }
  /* 一覧タブは見出しを1行にまとめ、表に使える高さを増やす */
  .view-header.compact { display: flex; align-items: baseline; gap: 0.25rem 0.85rem; flex-wrap: wrap; margin-bottom: 0.85rem; }
  .view-header.compact h2 { margin-bottom: 0; }
  .view-header-flex { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }

  .card-panel {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 1.5rem; box-shadow: var(--shadow-sm);
  }

  /* 5. フォーム */
  .form-section-title {
    font-size: 1.05rem; font-weight: 700; margin: 0.5rem 0 1rem; padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border); color: var(--text-main);
  }
  .form-section-title:first-child { margin-top: 0; }
  .form-section-title.no-border { border-bottom: none; margin: 0; padding: 0; }
  .form-section-title + p.small { margin-bottom: 1rem; }
  .form-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1.25rem; }
  .form-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 1rem; }
  .form-group { margin-bottom: 1.1rem; min-width: 0; }
  .form-group > label {
    display: flex; justify-content: flex-start; gap: 0.5rem; align-items: center; font-size: 0.85rem;
    font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;
  }
  .form-group-button { display: flex; align-items: flex-end; }
  .badge-required { font-size: 0.7rem; color: var(--danger); background: var(--danger-light); padding: 0.15rem 0.4rem; border-radius: var(--radius-sm); font-weight: 700; }
  .badge-optional { font-size: 0.7rem; color: var(--text-muted); background: var(--secondary-light); padding: 0.15rem 0.4rem; border-radius: var(--radius-sm); font-weight: 600; }

  .input-with-icon { position: relative; display: flex; align-items: center; }
  .input-with-icon .input-icon { position: absolute; left: 0.75rem; width: 1.15rem; height: 1.15rem; color: var(--text-light); pointer-events: none; flex-shrink: 0; }
  .form-group input[type="text"], .form-group input[type="date"], .form-group input[type="password"], .form-group select,
  .input-with-icon input {
    width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-md);
    font-size: 0.9rem; color: var(--text-main); background: var(--bg-card); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    height: 42px; min-height: 42px; max-height: 42px; box-sizing: border-box;
  }
  .input-with-icon input { padding-left: 2.35rem; }
  .form-group textarea {
    width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-md);
    font-size: 0.9rem; color: var(--text-main); background: var(--bg-card); outline: none; resize: vertical; min-height: 84px;
    transition: border-color 0.2s, box-shadow 0.2s; line-height: 1.6;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus, .input-with-icon input:focus {
    border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }
  .form-group input:disabled, .form-group select:disabled, .form-group textarea:disabled, .input-with-icon input:disabled {
    background: var(--secondary-light); color: var(--text-muted); cursor: not-allowed;
  }
  .form-group.has-error input, .form-group.has-error select, .form-group.has-error textarea { border-color: var(--danger); }
  .static-field {
    height: 42px; display: flex; align-items: center; padding: 0 0.85rem; border-radius: var(--radius-md);
    background: var(--secondary-light); color: var(--text-main); font-size: 0.9rem; font-weight: 600;
  }
  .field-error { color: var(--danger-hover); font-size: 0.78rem; font-weight: 600; margin-top: 0.3rem; min-height: 0; }
  .field-error:empty { display: none; }
  .field-error.center { text-align: center; }
  .field-hint { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.3rem; }
  .field-hint.danger { color: var(--danger-hover); font-weight: 600; }

  .radio-group { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
  .radio-pill {
    display: inline-flex; align-items: center; gap: 0.35rem; height: 32px; padding: 0 0.8rem;
    border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--bg-page);
    font-size: 0.8rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  }
  .radio-pill input { accent-color: var(--primary); }
  .radio-pill:has(input:checked) { background: var(--primary-light); color: var(--primary); border-color: rgba(2, 132, 199, 0.4); }
  .radio-pill:has(input:disabled) { cursor: not-allowed; opacity: 0.7; }

  /* 検索付きプルダウン */
  .combo { position: relative; }
  .combo-list {
    display: none; position: absolute; left: 0; right: 0; top: 46px; z-index: 50; max-height: 280px; overflow-y: auto;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  }
  .combo-list.open { display: block; }
  .combo-item { padding: 0.55rem 0.85rem; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid var(--secondary-light); }
  .combo-item:last-child { border-bottom: none; }
  .combo-item .combo-code { font-family: monospace; color: var(--text-muted); font-size: 0.75rem; margin-left: 0.4rem; }
  .combo-empty { padding: 0.75rem; color: var(--text-muted); font-size: 0.85rem; }
  .combo-selected { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem; }
  .combo-selected strong { color: var(--primary); font-family: monospace; }
  .party-manual { margin-top: 0; }

  /* 添付 */
  .attach-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .file-btn { position: relative; overflow: hidden; cursor: pointer; }
  .file-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .attach-current { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; font-size: 0.85rem; }
  .attach-name { display: inline-flex; align-items: center; gap: 0.3rem; font-weight: 600; word-break: break-all; }
  .attach-pending { color: var(--warning); font-size: 0.75rem; font-weight: 700; }
  .file-btn.disabled { opacity: 0.5; pointer-events: none; }

  .form-actions {
    display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.5rem; padding-top: 1.25rem;
    border-top: 1px solid var(--border);
  }
  .form-actions .spacer { flex: 1; }
  .form-meta {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; padding: 0.75rem 1rem; margin-bottom: 1rem;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.875rem;
  }
  .form-meta .req-id { font-family: 'Outfit', monospace; font-weight: 700; font-size: 1rem; }

  /* 注意ボックス（参考アプリの alert-lent-notice と同じ amber 系） */
  .alert-notice {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: var(--radius-md);
    padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.85rem; line-height: 1.6;
  }
  .alert-notice strong { color: #78350f; }
  .alert-notice.danger { background: var(--danger-light); border-color: #fecaca; color: #991b1b; }
  .alert-notice.danger strong { color: #7f1d1d; }

  /* 6. ボタン（高さ固定） */
  .btn-primary, .btn-secondary {
    padding: 0 1.25rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.9rem; cursor: pointer;
    transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    height: 42px; min-height: 42px; max-height: 42px; line-height: 1; flex-shrink: 0; box-sizing: border-box; white-space: nowrap;
  }
  .btn-primary { background: var(--primary-gradient); color: #ffffff; border: none; }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); transform: translateY(-1px); }
  .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); text-decoration: none; }
  .btn-secondary:hover:not(:disabled) { background: var(--secondary-light); border-color: #cbd5e1; }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm {
    height: 32px; min-height: 32px; max-height: 32px; padding: 0 0.75rem; font-size: 0.8rem; border-radius: var(--radius-sm);
    line-height: 1; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box;
  }
  .btn-success { background: var(--success); color: #ffffff; border: none; }
  .btn-success:hover:not(:disabled) { background: var(--success-hover); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
  .btn-success:disabled { background: #cbd5e1; }
  .btn-edit { background-color: var(--primary-light); color: var(--primary); border: 1px solid rgba(2, 132, 199, 0.25); font-weight: 600; cursor: pointer; }
  .btn-edit:hover:not(:disabled) { background-color: #bae6fd; color: var(--primary-hover); box-shadow: 0 2px 8px rgba(2, 132, 199, 0.2); }
  .btn-danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--danger-light); font-weight: 600; cursor: pointer; }
  .btn-danger-outline:hover:not(:disabled) { background: var(--danger-light); }
  .btn-danger-solid { background: var(--danger) !important; }
  .btn-edit:disabled, .btn-danger-outline:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn-full { width: 100%; }
  .action-buttons { display: flex; justify-content: center; gap: 0.35rem; white-space: nowrap; align-items: center; }
  .action-btn-group { display: inline-flex; align-items: center; gap: 0.35rem; vertical-align: middle; }
  .action-btn-group.wrap { flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; }
  .manual-link-btn {
    display: inline-flex; align-items: center; gap: 0.375rem; background-color: var(--bg-card); color: var(--primary);
    border: 1px solid var(--border); padding: 0 0.95rem; border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 600;
    text-decoration: none; box-shadow: var(--shadow-sm); height: 42px; white-space: nowrap;
  }

  /* 7. 一覧・フィルタ */
  .filter-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.65rem; }
  .filter-btn {
    display: inline-flex; align-items: center; justify-content: center; height: 30px; min-height: 30px; max-height: 30px;
    line-height: 1; padding: 0 0.85rem; border: 1px solid var(--border); background: var(--bg-page); border-radius: var(--radius-full);
    font-size: 0.8rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s; flex-shrink: 0;
  }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3); }
  .filter-btn .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.35rem; }
  .logs-filter-container {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.65rem; background-color: var(--bg-page);
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.75rem 0.85rem; margin-bottom: 1rem;
  }
  .logs-filter-container.compact { margin-bottom: 0.75rem; }
  .search-input-box { position: relative; display: flex; align-items: center; flex: 1 1 220px; min-width: 180px; }
  .search-box-input {
    width: 100%; padding: 0.45rem 0.85rem 0.45rem 2.1rem; font-size: 0.85rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-main); transition: all 0.2s; height: 34px;
  }
  .search-box-input:focus, .filter-box-date:focus, .filter-box-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12); }
  .search-box-icon { position: absolute; left: 0.65rem; width: 1rem; height: 1rem; color: var(--text-muted); pointer-events: none; }
  .filter-group-date { display: flex; align-items: center; gap: 0.35rem; }
  .filter-box-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .filter-box-date, .filter-box-select {
    padding: 0.4rem 0.5rem; font-size: 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg-card); color: var(--text-main); outline: none; transition: all 0.2s; height: 34px;
  }
  .filter-box-select { cursor: pointer; max-width: 200px; }
  .filter-text { width: 140px; }
  .date-separator { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; }
  .filter-reset-btn {
    display: inline-flex; align-items: center; gap: 0.3rem; padding: 0 0.75rem; height: 34px; font-size: 0.8rem; font-weight: 600;
    color: var(--text-muted); background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
  }
  .filter-group-status { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; }
  .filter-row-sep { width: 1px; height: 20px; background: var(--border); margin: 0 0.35rem; }
  .view-header-end { margin-left: auto; display: inline-flex; align-items: center; gap: 0.6rem; align-self: center; }
  .list-count { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }

  .bulk-action-bar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem;
    background: var(--secondary-light); padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; min-height: 52px;
  }
  .bulk-select-status { font-size: 0.875rem; color: var(--text-muted); }
  .bulk-select-status strong { color: var(--primary); font-size: 1rem; margin: 0 0.25rem; }

  .table-container { overflow-x: auto; }
  /* 一覧の表: 縦横ともこの枠の中でスクロールし、見出し行と左の列を固定する（高さは js の fitTables が画面に合わせる） */
  .table-container.fit { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
  /* 一覧タブは広い画面で横幅を広げ、横スクロールを減らす */
  .app-container.list-mode { max-width: 1600px; padding-bottom: 1rem; }
  .list-panel { padding-bottom: 1rem; }
  /* separate にしないと、固定したセルの罫線がスクロールで消える */
  .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85rem; text-align: left; }
  .data-table th {
    background: var(--secondary-light); color: var(--text-muted); font-weight: 600; padding: 0.7rem 0.75rem;
    border-bottom: 2px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 2;
  }
  .data-table thead [data-sort] { cursor: pointer; user-select: none; }
  .data-table thead [data-sort]:hover { color: var(--text-main); }
  .data-table thead .sorted-asc::after { content: ' ▲'; font-size: 0.65rem; color: var(--primary); }
  .data-table thead .sorted-desc::after { content: ' ▼'; font-size: 0.65rem; color: var(--primary); }
  .data-table .th-sep { color: var(--text-light); margin: 0 0.15rem; }
  .data-table td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
  .data-table tbody tr { background: var(--bg-card); }
  /* 操作列は右端に固定し、横スクロールしても見えるようにする */
  .data-table td.action-cell, .data-table th.action-head {
    position: sticky; right: 0; z-index: 1; box-shadow: -8px 0 8px -8px rgba(15, 23, 42, 0.18);
  }
  .data-table td.action-cell { background: inherit; }
  .data-table th.action-head { background: var(--secondary-light); z-index: 3; }
  /* 左の列（☑・届出ID）を固定し、横スクロールしてもどの行か分かるようにする */
  .data-table .sticky-col { position: sticky; left: 0; z-index: 1; }
